# ============================================================
#   VelocityCommandBlocker  -  by Muvixo
# ============================================================
#   Prefix default: MineStorm  (Aqua + White)
#   Mode: BLACKLIST ONLY - anything not in blocked-commands is allowed.
# ============================================================
#
#  SMART PERMISSION CHECK
#  ----------------------
#  Before blocking a command, the plugin checks whether the player
#  already has permission for it from another plugin, for example:
#     - essentials.vanish  / essentials.gamemode / essentials.give ...
#     - minecraft.command.op  / minecraft.command.gamemode ...
#     - bukkit.command.op / bukkit.command.reload ...
#     - <plugin>.command.<cmd>   (generic Bukkit-style)
#     - <plugin>.<cmd>           (generic plugin-style)
#  If any of those are granted, the command is NOT blocked even if
#  it is listed in blocked-commands. So a staff member who has
#  essentials.vanish in LuckPerms keeps /vanish, but a normal member
#  without permissions gets blocked.
# ============================================================
#
#  PERMISSIONS (add on Velocity with LuckPerms):
#    commandblocker.bypass  -> skip ALL blocking            (default: false)
#    commandblocker.admin   -> use /cb reload               (default: op)
#
#    /lp user <player> permission set commandblocker.bypass true
#    /lp group admin   permission set commandblocker.bypass true
#    /lp group default permission set commandblocker.bypass false
#
# ============================================================

settings:
  # Case-insensitive matching
  case-insensitive: true

  # Log blocked attempts to console
  log-blocked: true

  # Block the tab-complete suggestions for blocked commands too
  block-tab-complete: true

  # Also block namespaced variants  e.g.  bukkit:op  minecraft:give
  block-namespaced: true

  # Also block dangerous sub-commands based on first argument
  # e.g. /lp user X permission set ... -> blocked by arg "permission"
  block-dangerous-args: true

  # If true, when the player has permission for the command from
  # another plugin (essentials.*, minecraft.command.*, etc.) we
  # don't block it. Keep true for the "don't annoy people who
  # actually have permission" behavior.
  respect-other-permissions: true

# ============================================================
#  MESSAGES  (& = color code)
# ============================================================
messages:
  # Prefix  ->  MineStorm  [ Aqua + White ]
  prefix: "&b&lMineStorm &7» &r"

  blocked: "&cYou don't have permission to use this command!"
  blocked-namespaced: "&cThat command is not allowed here!"
  blocked-args: "&cThat sub-command is restricted!"

  # /cb creator
  creator: "&bCreated by &f&lMuvixo"

  # /cb reload
  reload-success: "&aConfiguration reloaded successfully!"
  reload-failed: "&cFailed to reload configuration. Check console."
  no-permission: "&cYou don't have permission to use this command."
  usage: "&bUsage: &f/commandblocker <reload|creator>"

# ============================================================
#  BLOCKED COMMANDS (BLACKLIST ONLY)
#  Only commands listed here are blocked for members.
#  Every other command is allowed by default.
# ============================================================
