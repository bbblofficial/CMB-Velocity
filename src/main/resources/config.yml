# ============================================================
#  DANGEROUS FIRST-ARGUMENTS
#  When block-dangerous-args is true, if the FIRST argument of
#  a command matches one of these, it's blocked too.
#  Example: /lp user X permission set  ->  "user" not in list,
#  but /lp permission set ...  ->  "permission" triggers block.
# ============================================================
dangerous-args:
  - permission
  - permissions
  - perm
  - perms
  - set
  - unset
  - add
  - remove
  - op
  - deop
  - ban
  - unban
  - kick
  - gamemode
  - give
  - stop
  - restart
  - reload
