# ============================================================
#   VelocityCommandBlocker  -  by Muvixo
# ============================================================
#   Prefix default: MineStorm  (Aqua + White)
#   Colors: use &codes  (&a &b &c &e &f &l &r ...)
# ============================================================
#
#  PERMISSIONS (add on Velocity with LuckPerms):
#    commandblocker.bypass  -> skip blocking            (default: false)
#    commandblocker.admin   -> use /cb reload           (default: op)
#
#  With LuckPerms on Velocity:
#    /lp user <player> permission set commandblocker.bypass true
#    /lp group admin   permission set commandblocker.bypass true
#    /lp group default permission set commandblocker.bypass false
#
# ============================================================

settings:
  # Whitelist mode: true  -> ONLY allowed-commands work
  #                 false -> blocked-commands are blocked
  use-whitelist: false

  # Case-insensitive matching
  case-insensitive: true

  # Log blocked attempts to console
  log-blocked: true

  # Block the tab-complete suggestions for blocked commands too (very important for security!)
  block-tab-complete: true

  # Also block namespaced variants  e.g.  bukkit:op  minecraft:give
  block-namespaced: true

  # Also block dangerous sub-commands based on first argument
  # e.g. /lp user X permission set *  ->  blocked by arg "permission"
  block-dangerous-args: true

# ============================================================
#  MESSAGES  (& = section sign, works everywhere)
# ============================================================
messages:
  # Prefix  ->  MineStorm  [ Aqua + White ]
  prefix: "&b&lMineStorm &7» &r"

  # Sent to a player when their command is blocked
  blocked: "&cYou don't have permission to use this command!"

  # Sent when a player tries to run a blocked command via tab/namespace
  blocked-namespaced: "&cThat command is not allowed here!"

  # Sent when a dangerous argument is blocked
  blocked-args: "&cThat sub-command is restricted!"

  # /cb creator
  creator: "&bCreated by &f&lMuvixo"

  # /cb reload
  reload-success: "&aConfiguration reloaded successfully!"
  reload-failed: "&cFailed to reload configuration. Check console."
  no-permission: "&cYou don't have permission to use this command."
  usage: "&bUsage: &f/commandblocker <reload|creator>"

# ============================================================
#  BLOCKED COMMANDS (used when use-whitelist: false)
#  Do NOT include the leading '/'
#  This is a FULL security list - feel free to trim it.
# ============================================================
